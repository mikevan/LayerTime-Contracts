name: Shared library consumers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layertime:
    name: LayerTime candidate
    uses: mikevan/LayerTime/.github/workflows/ci.yml@main
    with:
      product_ref: main
      candidate_repository: LayerTime-Contracts
      candidate_revision: ${{ github.sha }}
  vixen:
    name: Vixen candidate
    uses: mikevan/Vixen/.github/workflows/ci.yml@main
    with:
      product_ref: main
      candidate_repository: LayerTime-Contracts
      candidate_revision: ${{ github.sha }}
